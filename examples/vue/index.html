<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trevixal, Vue</title>
    <style>
      /* The page's own margin, and nothing else. Every rule the editor needs
         ships with @trevixal/editor-kit and is imported by the script below. */
      body {
        margin: 0;
      }
    </style>
  </head>
  <!-- `trevixal` on the page as well as on the editor: the theme tokens are
       inherited, so the margin around the editor follows the theme rather
       than staying white behind a dark document. -->
  <body class="trevixal">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
