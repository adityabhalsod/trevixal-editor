<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trevixal, full editor example</title>
    <!-- Inline, so the page asks for no favicon.ico it does not have: the
         browser requests one either way, and a 404 in the console reads
         like a broken demo. A data URI also survives opening from disk. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f6fed%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27system-ui,sans-serif%27 font-size=%2720%27 font-weight=%27600%27 fill=%27%23fff%27 text-anchor=%27middle%27%3ET%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* The page's own margins, and nothing else. Every rule the editor needs
         (the shell, the panes, the panels, the readouts and the syntax
         palette) ships with @trevixal/editor-kit and is imported by the
         script below. */
      body {
        margin: 0;
      }
    </style>
  </head>
  <!-- `trevixal` on the page as well as on the editor's own root: the theme
       tokens are inherited, so the margin around the editor follows the theme
       instead of staying white behind a dark document. -->
  <body class="trevixal">
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
