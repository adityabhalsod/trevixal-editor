name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A reproduction is worth more than a
        description: the [live editor](https://trevixal-editor.vercel.app/full-editor)
        is often the quickest way to show what you mean.

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `npm ls @trevixal/core`
      placeholder: "@trevixal/core@1.0.2"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package
      options:
        - "@trevixal/core"
        - "@trevixal/ui"
        - "@trevixal/editor-kit"
        - A framework adapter (react, vue, svelte, angular, web-component)
        - An extension
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link, or the smallest snippet that shows it.

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 151 on Windows 11
