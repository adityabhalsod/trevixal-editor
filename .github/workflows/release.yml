name: Release

on:
  push:
    branches: [main]
    # This workflow creates those tags. Listening for them would have a
    # publish start another release run.
    tags-ignore: ['**']

# One release run at a time; a second push waits rather than racing the first
# to open the version PR or publish.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and tags
  pull-requests: write # open and update the "chore: release" PR
  # Trusted publishing. npm exchanges this run's OIDC identity for a
  # short-lived credential, so no token is stored anywhere, and mints the
  # provenance attestation from the same identity.
  id-token: write

jobs:
  release:
    name: Version PR or publish
    # Same `[skip cicd]` marker as CI. Only the push event reaches this
    # workflow, so only the head commit is worth reading.
    if: "!contains(github.event.head_commit.message || '', '[skip cicd]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets reads history to work out what changed since the last release.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14; 22 resolves to the
          # latest 22.x, which is well past that.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The runner ships npm 10; the OIDC exchange landed in 11.5.1. pnpm
      # still runs every other step, it just cannot publish this way: it has
      # no exchange for the npm:registry.npmjs.org audience.
      - run: npm install --global npm@latest

      - run: pnpm install --frozen-lockfile

      # Everything below must pass before the publish step can run. A failing
      # step fails the job, and the changesets action never starts.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:pkg

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          # Not `changeset publish`: that shells out to `pnpm publish`, which
          # can only authenticate with a token. This script packs with pnpm,
          # so `workspace:^` is rewritten to a real range, then uploads each
          # tarball with npm, which is the tool that speaks OIDC.
          publish: node scripts/publish-packages.mjs
          title: 'chore: release'
          commit: 'chore: release'
        env:
          # Only for opening the version PR and pushing tags. There is no
          # NPM_TOKEN: the registry credential comes from OIDC at publish
          # time. Provenance is automatic for a trusted publish, so there is
          # no NPM_CONFIG_PROVENANCE either.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
