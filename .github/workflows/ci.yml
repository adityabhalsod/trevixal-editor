name: CI

on:
  # Every branch, so a push is checked whether or not a pull request exists
  # yet. Tags are skipped: a release tags a commit that was already checked
  # on its way into main, and re-running the suite would only repeat that.
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, coverage, package check
    # A branch in this repository already ran on its push, so the pull request
    # event would be a second identical run. A fork's branch pushes nothing
    # here, and the pull request event is the only way to see it at all.
    #
    # `[skip cicd]` in the head commit message, or in the pull request's
    # title, skips the job. A job-level `if` can read only the github, needs,
    # vars and inputs contexts, so the two fields are named here rather than
    # folded into an `env` the condition could not see.
    #
    # `head_commit` is null on a pull request and `pull_request` is null on a
    # push, so each side is defaulted to '' before `contains` reads it.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository) &&
      !contains(github.event.head_commit.message || '', '[skip cicd]') &&
      !contains(github.event.pull_request.title || '', '[skip cicd]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Formatting and lint first: it is the fastest of these, so a misplaced
      # brace fails in seconds rather than after the whole suite has run.
      - name: Lint and format
        run: pnpm lint

      # The build has to come before typecheck and the package check: both
      # read the `dist` a package's siblings emit, not its source.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # The engine's own gate, and the only package with one: 90% of lines,
      # functions and statements across the model, state, commands, history
      # and serializer. Under that, vitest exits non-zero on its own.
      - name: Coverage thresholds
        run: pnpm coverage

      # publint + arethetypeswrong over every publishable package: the same
      # gate the release runs before it is allowed to publish anything.
      - run: pnpm check:pkg
